name: Deploy a producción (FTP)

# Compila el sitio y lo sube por FTP/FTPS al server propio.
# Requiere 3 secretos en el repo (Settings > Secrets and variables > Actions):
#   FTP_SERVER    -> host del FTP (ej: ftp.tudominio.com o una IP)
#   FTP_USERNAME  -> usuario del FTP
#   FTP_PASSWORD  -> contraseña del FTP
#
# Arranca en modo MANUAL (workflow_dispatch) para no fallar antes de tener
# los secretos. Cuando confirmemos que sube bien, lo pasamos a automático en push.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      # Build de PRODUCCIÓN: base "/" y dominio real (sin el subpath del preview).
      - run: npm run build
      - name: Subir dist/ al FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (FTP sobre TLS) si el host lo soporta. Si sólo hay FTP plano,
          # cambiar a: protocol: ftp
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # Carpeta destino en el FTP (raíz web del sitio nuevo).
          # Ajustar si la raíz web no es exactamente /home/.
          server-dir: /home/
          # Evita borrar por error el backup mientras exista en el server.
          exclude: |
            **/.git*
            **/retired-wp/**
