name: Deploy preview to GitHub Pages

# Publica un preview del sitio (compilado con Astro) en GitHub Pages.
# Sólo para previsualizar el avance; la producción irá al server propio.

on:
  push:
    branches: [claude/buinet-wordpress-migration-cwo0m4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Deriva URL y subdirectorio del nombre real del repo (robusto a renames).
      - name: Configurar base del preview
        run: |
          echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          echo "PAGES_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      # Habilita Pages con fuente "GitHub Actions" automáticamente.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --omit=dev
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
