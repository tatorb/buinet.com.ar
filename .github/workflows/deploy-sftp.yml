name: Deploy a producción (SFTP)

# Compila el sitio y lo sube por SFTP al server propio.
# Requiere secretos en el repo (Settings > Secrets and variables > Actions):
#   SSH_HOST      -> host del server (ej: buinet.com.ar o la IP)
#   SSH_USER      -> usuario SFTP
#   SSH_PASSWORD  -> contraseña SFTP
#   SSH_PORT      -> (opcional) puerto SFTP; por defecto 22
#
# Arranca en modo MANUAL (workflow_dispatch). Cuando confirmemos que sube y
# carga bien, lo pasamos a automático en cada push.
#
# SEGURIDAD: la primera corrida es NO destructiva (no borra nada del server) y
# ADEMÁS excluye wp-content, así tus imágenes en /home/wp-content quedan intactas.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      # Build de PRODUCCIÓN: base "/" y dominio real.
      - run: npm run build

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Subir dist/ por SFTP (respeta wp-content)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # mirror -R = subir (local -> remoto). SIN --delete en esta etapa (no destructivo).
          # --exclude-glob wp-content* protege las imágenes ya subidas.
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 25;
            open -u \"$SSH_USER\",\"$SSH_PASSWORD\" sftp://$SSH_HOST:$PORT;
            mirror -R --parallel=4 --verbose \
              --exclude-glob wp-content \
              --exclude-glob wp-content/ \
              ./dist/ /home/;
            bye;
          "
