name: Deploy a producción (SFTP)

# Compila el sitio y lo sube por SFTP al server propio.
# Requiere secretos en el repo (Settings > Secrets and variables > Actions):
#   SSH_HOST      -> host del server (ej: buinet.com.ar o la IP)
#   SSH_USER      -> usuario SFTP
#   SSH_PASSWORD  -> contraseña SFTP
#   SSH_PORT      -> (opcional) puerto SFTP; por defecto 22
#
# Arranca en modo MANUAL (workflow_dispatch). Cuando confirmemos que sube y
# carga bien, lo pasamos a automático en cada push.
#
# SEGURIDAD: la primera corrida es NO destructiva (no borra nada del server) y
# ADEMÁS excluye wp-content, así tus imágenes en /home/wp-content quedan intactas.

on:
  workflow_dispatch:
  push:
    branches: [claude/buinet-wordpress-migration-cwo0m4, main]
    # OJO: no usar '**.md' acá. Las entradas del blog son .md dentro de
    # src/content/blog/, así que ese patrón impedía que publicar un artículo
    # disparara el deploy. Solo ignoramos los .md de la raíz (README y demás).
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el sitemap toma el lastmod de cada URL del
          # último commit de git que tocó el archivo (ver astro.config.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      # Build de PRODUCCIÓN: base "/" y dominio real.
      - run: npm run build

      # Salida de emergencia. Guarda el sitio ya compilado como artefacto
      # descargable desde la página de Actions. Va ANTES de los pasos de
      # subida a propósito: corre aunque el deploy falle, así siempre hay una
      # forma de publicar a mano sin depender de apt ni de los mirrors.
      # include-hidden-files es obligatorio: sin eso .htaccess queda afuera y
      # con él se van todos los redirects 301 y 410 del sitio.
      - name: Guardar el sitio compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sitio-compilado
          path: dist/
          include-hidden-files: true
          retention-days: 14

      - name: Instalar lftp (opcional)
        id: lftp
        # lftp es el camino preferido porque hace el mirror incremental. Pero
        # los mirrors de Ubuntu fallan cada tanto por DNS y el 11/11/2026
        # eso dejó cuatro corridas seguidas sin publicar. Así que este paso
        # NO puede tumbar el deploy: si lftp no se puede instalar, lo informa
        # y el paso siguiente sube por sftp, que ya viene en el runner.
        run: |
          set -u
          for intento in 1 2; do
            # Timeouts cortos: sin esto cada intento tarda 4-5 minutos en
            # morir y el paso se come doce. Con 10s se rinde enseguida y el
            # respaldo entra casi sin demora.
            APT_T="-o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1"
            if sudo apt-get update $APT_T \
               && sudo apt-get install -y --no-install-recommends $APT_T lftp; then
              echo "hay_lftp=si" >> "$GITHUB_OUTPUT"
              echo "lftp instalado en el intento $intento."
              exit 0
            fi
            [ "$intento" = 1 ] && sleep 20
          done
          echo "hay_lftp=no" >> "$GITHUB_OUTPUT"
          echo "::warning::No se pudo instalar lftp. Se sube por sftp."
        continue-on-error: true

      - name: Subir dist/ con lftp (respeta wp-content)
        if: steps.lftp.outputs.hay_lftp == 'si'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # Limpia el host por si vino con esquema (http://, sftp://) o ruta.
          HOST="$SSH_HOST"
          HOST="${HOST##*://}"   # quita esquema
          HOST="${HOST%%/*}"     # quita cualquier /ruta
          # sshpass pasa la contraseña a ssh (lftp+sftp por sí solo no puede).
          export SSHPASS="$SSH_PASSWORD"
          # Destino real = raíz web del dominio (donde ya está wp-content).
          DEST="${REMOTE_PATH:-buinetweb/home}"
          OPEN="set sftp:auto-confirm yes; set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'; set net:max-retries 2; set net:timeout 25; open -u \"$SSH_USER\",dummy sftp://$HOST:$PORT;"

          # 1) Limpieza best-effort: quitar archivos del sitio que quedaron sueltos
          #    en la carpeta personal del usuario en una corrida previa.
          lftp -c "$OPEN glob -a rm -r 404.html favicon.svg index.html robots.txt sitemap-0.xml sitemap-index.xml _astro audio-ip camscope contacto control-de-accesos data-center infraestructura-de-red novedades politicas-de-privacidad sobre-nosotros videovigilancia; bye" || true

          # 2) Deploy real al docroot. SIN --delete (no destructivo).
          #    --no-perms evita chmod; --exclude-glob wp-content protege las imágenes.
          # Corrige el nombre de la carpeta de medios: 'upload' (singular) -> 'uploads'
          # (así coinciden las rutas de WordPress /wp-content/uploads/...). Idempotente.
          lftp -c "$OPEN mv \"$DEST\"/wp-content/upload \"$DEST\"/wp-content/uploads; bye;" || true

          lftp -c "$OPEN echo '--- Subiendo el sitio ---'; mirror -R --no-perms --parallel=2 --verbose --exclude-glob wp-content ./dist/ \"$DEST\"; bye;"

      - name: Subir dist/ con sftp (respaldo si no hay lftp)
        if: steps.lftp.outputs.hay_lftp != 'si'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        # Camino de respaldo: sftp y sshpass ya vienen en el runner, así que
        # no depende de bajar ningún paquete. No usa "put -r" porque su manejo
        # de directorios existentes cambia entre versiones de OpenSSH: en vez
        # de eso arma un lote explícito, un -mkdir por carpeta (el guión
        # inicial ignora el error si ya existe) y un put por archivo.
        #
        # Igual que el mirror de lftp, es NO DESTRUCTIVO: solo escribe lo que
        # hay en dist/, así que wp-content queda intacto por construcción.
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          HOST="$SSH_HOST"; HOST="${HOST##*://}"; HOST="${HOST%%/*}"
          DEST="${REMOTE_PATH:-buinetweb/home}"
          export SSHPASS="$SSH_PASSWORD"

          LOTE="$(mktemp)"
          {
            echo "cd \"$DEST\""
            # Carpetas primero. find+sort deja al padre antes que al hijo,
            # porque el padre es prefijo del hijo.
            (cd dist && find . -mindepth 1 -type d | sed 's|^\./||' | sort) \
              | while IFS= read -r d; do echo "-mkdir \"$d\""; done
            (cd dist && find . -type f | sed 's|^\./||' | sort) \
              | while IFS= read -r f; do echo "put \"dist/$f\" \"$f\""; done
            echo "bye"
          } > "$LOTE"

          echo "--- Subiendo $(grep -c '^put' "$LOTE") archivos en $(grep -c '^-mkdir' "$LOTE") carpetas ---"
          # OJO con BatchMode. Pasarle -b a sftp activa BatchMode=yes de forma
          # implícita, y eso desactiva el prompt de contraseña: sshpass se
          # queda sin dónde inyectarla y el server responde "Permission
          # denied". Por eso hay que volver a apagarlo a mano.
          # PubkeyAuthentication=no evita que pierda tiempo ofreciendo claves
          # que no existen antes de llegar a la contraseña.
          sshpass -e sftp \
            -o BatchMode=no \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=25 \
            -P "$PORT" -b "$LOTE" "$SSH_USER@$HOST"
          echo "--- Subida completa ---"
